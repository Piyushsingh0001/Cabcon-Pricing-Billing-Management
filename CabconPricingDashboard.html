<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Cabcon — SKU Pricing Dashboard</title>
<style>
  :root{--navy:#0D1F4C;--red:#C1121F;--ink:#1A2230;--mute:#6B7385;--line:#E2E5EA;--bg:#F5F6F8;--panel:#fff}
  *{box-sizing:border-box}
  body{margin:0;font-family:Arial,Helvetica,sans-serif;background:var(--bg);color:var(--ink)}
  .hdr{background:var(--panel);border-bottom:1px solid var(--line);padding:14px 22px;display:flex;align-items:center;justify-content:space-between;flex-wrap:wrap;gap:12px}
  .hdr img{height:38px}
  .tabs{display:flex;gap:4px;padding:0 22px;background:var(--panel);border-bottom:1px solid var(--line)}
  .tab{background:none;border:none;padding:13px 16px;cursor:pointer;font-size:13.5px;font-family:Arial;color:var(--mute);border-bottom:3px solid transparent}
  .tab.on{color:var(--navy);font-weight:700;border-bottom:3px solid var(--red)}
  .wrap{padding:22px;max-width:1180px;margin:0 auto}
  .card{background:var(--panel);border:1px solid var(--line);border-radius:8px;padding:16px}
  .btn{background:var(--navy);color:#fff;border:none;border-radius:6px;padding:7px 14px;font-size:12.5px;cursor:pointer;font-family:Arial;font-weight:600}
  .btn:hover{background:#16306b}
  .btn:disabled{opacity:.5;cursor:default}
  .btn.ghost{background:#fff;color:var(--navy);border:1px solid var(--navy)}
  .btn.ghost:hover{background:#F0F3FA}
  .linkbtn{background:none;border:none;color:#cdd6ec;cursor:pointer;font-size:11.5px;font-family:Arial;text-decoration:underline}
  .linkbtn.dark{color:var(--mute)}
  .in{border:1px solid var(--line);border-radius:5px;padding:6px 8px;font-size:12.5px;font-family:Arial;color:var(--ink)}
  .in:focus{outline:none;border-color:var(--navy)}
  .in.mini{width:56px;padding:4px 6px;text-align:right}
  .bare{border:none;background:none;font-family:Arial;outline:none;font-weight:700;font-size:15px;color:var(--navy)}
  .bare:focus{border-bottom:1px solid var(--line)}
  .sel{border:1px solid var(--line);border-radius:5px;padding:6px;font-size:12px;font-family:Arial;background:#fff;color:var(--ink)}
  .tbl{width:100%;border-collapse:collapse;font-size:12.5px}
  .tbl th{background:#FAFBFC;color:var(--mute);font-weight:600;padding:9px 10px;text-align:center;border-bottom:1px solid var(--line);white-space:nowrap}
  .tbl td{padding:9px 10px;text-align:center;border-bottom:1px solid #F0F2F5}
  .tbl tbody tr:hover{background:#FAFBFC}
  .tag{margin-left:6px;font-size:10px;background:#FFE9C7;color:#8A5A00;padding:1px 6px;border-radius:3px}
  .lbl{font-size:11px;color:var(--mute);margin-bottom:3px}
  .sh-t{font-size:18px;font-weight:700;color:var(--navy)}
  .sh-s{font-size:12.5px;color:var(--mute);margin-top:2px}
  .grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:14px}
  .overlay{position:fixed;inset:0;background:rgba(13,31,76,.45);overflow:auto;padding:60px 20px 40px;z-index:9}
  .sheet{background:#fff;max-width:760px;margin:0 auto;padding:40px 44px;border-radius:6px;box-shadow:0 20px 60px rgba(0,0,0,.25)}
  .qtbl{width:100%;border-collapse:collapse;font-size:12.5px;margin-top:6px}
  .qtbl th{background:var(--navy);color:#fff;padding:9px 10px;text-align:center;font-weight:600}
  .qtbl td{padding:8px 10px;text-align:center;border-bottom:1px solid var(--line)}
  .qtbl tfoot td{border-top:2px solid var(--navy);background:#FAFBFC}
  @media print{[data-chrome]{display:none !important}.overlay{position:static;background:#fff;padding:0}.sheet{box-shadow:none;max-width:100%;margin:0;padding:0}}
</style>
</head>

const KEY="cil_pricing_master_v1";
const today=()=>new Date().toISOString().slice(0,10);
const num=v=>{const n=parseFloat(v);return isFinite(n)?n:0;};
const inr=(n,dp=2)=>num(n).toLocaleString("en-IN",{minimumFractionDigits:dp,maximumFractionDigits:dp});
const esc=s=>String(s==null?"":s).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;").replace(/"/g,"&quot;");

/* cost engine — identical to spreadsheet */
const landed=m=>!m?0:(m.type==="exchange"?((num(m.lme)+num(m.premium))*num(m.fx)+num(m.freight))/1000:num(m.rate));
const matById=id=>S.materials.find(m=>m.id===id);
const skuRM=s=>s.bom.reduce((a,b)=>a+num(b.weight)*landed(matById(b.materialId)),0);
const skuWt=s=>s.bom.reduce((a,b)=>a+num(b.weight),0);
const skuMfg=(s,mfgVal)=>{const rm=skuRM(s);const m=num(mfgVal);return s.convType==="pct"?rm*(1+m/100):rm+skuWt(s)*m;};

/* seed */
const seedMaterials=()=>[
 {id:"cu",name:"Copper",type:"exchange",lme:13400,premium:410,fx:95,freight:6500,asOn:today()},
 {id:"al",name:"Aluminium (EC)",type:"exchange",lme:2650,premium:250,fx:87,freight:6500,asOn:today(),placeholder:true},
 {id:"pvcfr",name:"PVC-FR",type:"direct",rate:100,asOn:today()},
 {id:"steel",name:"GI Steel Wire",type:"direct",rate:75,asOn:today(),placeholder:true},
 {id:"xlpe",name:"XLPE",type:"direct",rate:150,asOn:today(),placeholder:true}];
const HW=[[0.5,0.367,0.43],[0.75,0.55,0.58],[1.0,0.73,0.78],[1.5,1.09,0.94],[2.5,1.83,1.2],[4.0,2.9,1.3],[6.0,4.34,2.0],[10.0,7.34,2.8]];
const seedSkus=()=>{
 const hw=HW.map(([s,cu,pvc])=>({id:"hw"+s,category:"Housing Wire FR",name:"FR",spec:s+" sq.mm",unit:"coil",bom:[{materialId:"cu",weight:cu},{materialId:"pvcfr",weight:pvc}],convType:"pct",convValue:0.08,gst:0.18}));
 const t=[
  {id:"aaac_rabbit",category:"Conductor",name:"AAAC",spec:"Rabbit 50 sq.mm",unit:"km",bom:[{materialId:"al",weight:162}],convType:"perkg",convValue:18,gst:0.18,placeholder:true},
  {id:"lt_3595",category:"LT Cable",name:"XLPE Al",spec:"3.5C × 95 sq.mm",unit:"km",bom:[{materialId:"al",weight:920},{materialId:"xlpe",weight:180},{materialId:"pvcfr",weight:160}],convType:"perkg",convValue:25,gst:0.18,placeholder:true}];
 return hw.concat(t);
};

/* state + persistence (localStorage = this machine) */
let S;
function load(){
 try{const r=localStorage.getItem(KEY);if(r){const d=JSON.parse(r);S={materials:d.materials,skus:d.skus};}}catch(e){}
 if(!S)S={materials:seedMaterials(),skus:seedSkus()};
 S.tab="prices";S.selected={};S.L={mode:"simplePct",pct:15,amt:0,overhead:6,margin:12,packing:0,freight:0};S.over={};S.party="";S.validity=7;S.editing=null;S.note="";
}
function save(){try{localStorage.setItem(KEY,JSON.stringify({materials:S.materials,skus:S.skus}));}catch(e){}}
function flash(m){S.note=m;render();setTimeout(()=>{S.note="";render();},1600);}

/* mutations */
function setMat(id,f,v){const m=matById(id);m[f]=v;save();render();}
function setMatType(id,v){const m=matById(id);m.type=v;save();render();}
function stamp(id){const m=matById(id);m.asOn=today();m.placeholder=false;save();flash("Price updated");}
function addMat(){S.materials.push({id:"m"+Date.now(),name:"New material",type:"direct",rate:0,asOn:today()});save();render();}
function setTab(t){S.tab=t;render();}
function toggleSel(id){S.selected[id]=!S.selected[id];render();}
function toggleCat(c){const ids=S.skus.filter(s=>s.category===c).map(s=>s.id);const all=ids.every(i=>S.selected[i]);ids.forEach(i=>S.selected[i]=!all);render();}
function addSku(){const id="s"+Date.now();S.skus.push({id,category:"New category",name:"Item",spec:"spec",unit:"km",bom:[{materialId:S.materials[0].id,weight:0}],convType:"pct",convValue:0.08,gst:0.18});S.editing=id;save();render();}
function editSku(id){S.editing=S.editing===id?null:id;render();}
function delSku(id){S.skus=S.skus.filter(s=>s.id!==id);S.editing=null;save();flash("Product removed");}
function setSku(id,f,v){const s=S.skus.find(x=>x.id===id);s[f]=v;save();render();}
function setConv(id,f,v){const s=S.skus.find(x=>x.id===id);if(f==="convValue"&&s.convType==="pct")s.convValue=num(v)/100;else if(f==="gst")s.gst=num(v)/100;else s[f]=v;save();render();}
function setBom(id,i,f,v){const s=S.skus.find(x=>x.id===id);s.bom[i][f]=v;save();render();}
function addLine(id){const s=S.skus.find(x=>x.id===id);s.bom.push({materialId:S.materials[0].id,weight:0});save();render();}
function delLine(id,i){const s=S.skus.find(x=>x.id===id);s.bom=s.bom.filter((_,j)=>j!==i);save();render();}
function setL(f,v){S.L[f]=v;render();}
function setOv(id,f,v){S.over[id]=Object.assign({},S.over[id],{[f]:v});render();}
function clearOv(){S.over={};render();}
function setParty(v){S.party=v;render();}
function setValidity(v){S.validity=v;render();}

function effOfferEx(s){
 const o=S.over[s.id]||{};const mfg=skuMfg(s,o.mfg);
 if(o.offer!==undefined&&o.offer!=="")return num(o.offer);
 if(S.L.mode==="simplePct")return mfg*(1+num(o.pct!==undefined?o.pct:S.L.pct)/100);
 if(S.L.mode==="simpleAmt")return mfg+num(o.amt!==undefined?o.amt:S.L.amt);
 return mfg*(1+(num(S.L.overhead)+num(S.L.margin))/100)+num(S.L.packing)+num(S.L.freight);
}
const selList=()=>S.skus.filter(s=>S.selected[s.id]);

/* ---------- views ---------- */
function viewHeader(){
 const cu=matById("cu"),al=matById("al");
 return `<div class="hdr" data-chrome>
  <div style="display:flex;align-items:center;gap:16px">
   <img src="${LOGO}" alt="Cabcon"/>
   <div style="border-left:1px solid var(--line);padding-left:16px">
    <div style="font-size:16px;font-weight:700;color:var(--navy)">SKU Pricing Dashboard</div>
    <div style="font-size:11.5px;color:var(--mute)">Raw-material driven cost &amp; offer pricing</div></div></div>
  <div style="font-size:11.5px;color:var(--mute);text-align:right;line-height:1.5">
   <div>Copper as on <b style="color:var(--ink)">${cu?cu.asOn:"—"}</b> · ₹${inr(landed(cu))}/kg</div>
   <div>Aluminium as on <b style="color:var(--ink)">${al?al.asOn:"—"}</b> · ₹${inr(landed(al))}/kg</div></div></div>`;
}
function viewTabs(){
 const n=selList().length;
 const t=[["prices","1 · Daily Prices"],["skus","2 · Products"],["offer","3 · Offer & Send"+(n?" ("+n+")":"")]];
 return `<div class="tabs" data-chrome>${t.map(([k,l])=>`<button class="tab ${S.tab===k?'on':''}" onclick="setTab('${k}')">${l}</button>`).join("")}
  ${S.note?`<span style="margin-left:auto;align-self:center;font-size:12px;color:#1B7A3D">${esc(S.note)}</span>`:""}</div>`;
}
function head(t,s,a){return `<div style="display:flex;justify-content:space-between;align-items:flex-end;margin-bottom:14px;flex-wrap:wrap;gap:10px"><div><div class="sh-t">${t}</div><div class="sh-s">${s}</div></div>${a||""}</div>`;}

function viewPrices(){
 const cards=S.materials.map(m=>{
  const fields=m.type==="exchange"
   ?[["LME (USD/MT)","lme"],["Premium (USD/MT)","premium"],["FX (₹/USD)","fx"],["Freight (₹/MT)","freight"]]
     .map(([l,f])=>`<div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:6px"><span style="font-size:12px;color:var(--mute)">${l}</span><input class="in" style="width:110px;text-align:right" data-fkey="m-${m.id}-${f}" value="${esc(m[f])}" oninput="setMat('${m.id}','${f}',this.value)"></div>`).join("")
   :`<div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:6px"><span style="font-size:12px;color:var(--mute)">Price (₹/kg)</span><input class="in" style="width:110px;text-align:right" data-fkey="m-${m.id}-rate" value="${esc(m.rate)}" oninput="setMat('${m.id}','rate',this.value)"></div>`;
  return `<div class="card">
   <div style="display:flex;justify-content:space-between;align-items:baseline;gap:8px">
    <input class="bare" style="width:60%" data-fkey="m-${m.id}-name" value="${esc(m.name)}" oninput="setMat('${m.id}','name',this.value)">
    <select class="sel" onchange="setMatType('${m.id}',this.value)"><option value="exchange"${m.type==="exchange"?" selected":""}>LME-linked</option><option value="direct"${m.type==="direct"?" selected":""}>Direct ₹/kg</option></select></div>
   ${m.placeholder?'<span class="tag">example — set price today</span>':""}
   <div style="margin-top:8px">${fields}</div>
   <div style="margin-top:10px;padding-top:10px;border-top:1px dashed var(--line);display:flex;justify-content:space-between;align-items:center">
    <div><div style="font-size:11px;color:var(--mute)">Landed cost</div><div style="font-size:20px;font-weight:700">₹${inr(landed(m))}<span style="font-size:11px;color:var(--mute);font-weight:400">/kg</span></div></div>
    <div style="text-align:right"><div style="font-size:11px;color:var(--mute)">as on ${m.asOn||"—"}</div><button class="btn" style="margin-top:4px" onclick="stamp('${m.id}')">Update price</button></div></div></div>`;
 }).join("");
 return head("Daily raw-material prices","Update inputs, then stamp the date. Exchange metals build up from LME; others are a direct ₹/kg.",`<button class="btn ghost" onclick="addMat()">+ Add material</button>`)+`<div class="grid">${cards}</div>`;
}

function viewProducts(){
 const cats=[...new Set(S.skus.map(s=>s.category))];
 const selCount=Object.values(S.selected).filter(Boolean).length;
 const blocks=cats.map(cat=>{
  const rows=S.skus.filter(s=>s.category===cat).map(s=>{
   const rm=skuRM(s);
   const bom=s.bom.map(b=>{const mm=matById(b.materialId);return ((mm&&mm.name?mm.name.split(" ")[0]:"?")+" "+b.weight);}).join(" · ");
   const basis=s.convType==="pct"?"MFG % at offer":"MFG ₹/kg at offer";
   return `<tr style="background:${S.selected[s.id]?'#FFF4F4':'transparent'}">
    <td><input type="checkbox" ${S.selected[s.id]?"checked":""} onclick="toggleSel('${s.id}')"></td>
    <td style="text-align:left;font-weight:600">${esc(s.spec)}${s.placeholder?'<span class="tag">example</span>':""}</td>
    <td>${s.unit}</td><td style="font-size:11px;color:var(--mute);text-align:left">${esc(bom)}</td>
    <td style="font-weight:700">${inr(rm)}</td><td style="color:var(--mute);font-size:11px">${basis}</td>
    <td><button class="linkbtn dark" onclick="editSku('${s.id}')">${S.editing===s.id?"close":"edit"}</button></td></tr>`;
  }).join("");
  const editing=S.skus.find(x=>x.id===S.editing&&x.category===cat);
  const editPanel=editing?viewEdit(editing):"";
  return `<div class="card" style="margin-bottom:14px;padding:0;overflow:hidden">
   <div style="background:var(--navy);color:#fff;padding:9px 14px;display:flex;align-items:center;justify-content:space-between"><span style="font-weight:700;font-size:13.5px">${esc(cat)}</span><button class="linkbtn" onclick="toggleCat('${esc(cat).replace(/'/g,"\\'")}')">select all</button></div>
   <div style="overflow-x:auto"><table class="tbl"><thead><tr><th></th><th style="text-align:left">Spec</th><th>Unit</th><th>BOM</th><th>RM ₹/unit</th><th>MFG basis</th><th></th></tr></thead><tbody>${rows}</tbody></table></div>${editPanel}</div>`;
 }).join("");
 const action=`<div style="display:flex;gap:8px"><button class="btn ghost" onclick="addSku()">+ Add product</button><button class="btn" onclick="setTab('offer')" ${selCount?"":"disabled"}>Offer (${selCount}) →</button></div>`;
 return head("Products & live cost","Cost recalculates from current prices. Tick products to take into an offer.",action)+blocks;
}

function viewEdit(s){
 const opt=(sel)=>S.materials.map(m=>`<option value="${m.id}"${m.id===sel?" selected":""}>${esc(m.name)}</option>`).join("");
 const lines=s.bom.map((b,i)=>`<div style="display:flex;gap:8px;align-items:center;margin-bottom:6px">
   <select class="sel" onchange="setBom('${s.id}',${i},'materialId',this.value)">${opt(b.materialId)}</select>
   <input class="in" style="width:90px" data-fkey="b-${s.id}-${i}" value="${esc(b.weight)}" oninput="setBom('${s.id}',${i},'weight',this.value)">
   <span style="font-size:11px;color:var(--mute)">kg × ₹${inr(landed(matById(b.materialId)))} = ₹${inr(num(b.weight)*landed(matById(b.materialId)))}</span>
   <button class="linkbtn dark" onclick="delLine('${s.id}',${i})">remove</button></div>`).join("");
 const f=(l,inner)=>`<div><div class="lbl">${l}</div>${inner}</div>`;
 return `<div style="background:#FAFBFC;border-top:1px solid var(--line);padding:14px">
  <div style="display:flex;gap:10px;flex-wrap:wrap;margin-bottom:10px">
   ${f("Category",`<input class="in" data-fkey="s-${s.id}-cat" value="${esc(s.category)}" oninput="setSku('${s.id}','category',this.value)">`)}
   ${f("Variant",`<input class="in" data-fkey="s-${s.id}-name" value="${esc(s.name)}" oninput="setSku('${s.id}','name',this.value)">`)}
   ${f("Spec",`<input class="in" data-fkey="s-${s.id}-spec" value="${esc(s.spec)}" oninput="setSku('${s.id}','spec',this.value)">`)}
   ${f("Unit",`<select class="sel" onchange="setSku('${s.id}','unit',this.value)">${["coil","100m","km","MT"].map(u=>`<option${u===s.unit?" selected":""}>${u}</option>`).join("")}</select>`)}
   ${f("MFG method",`<select class="sel" onchange="setSku('${s.id}','convType',this.value)"><option value="pct"${s.convType==="pct"?" selected":""}>% of RM</option><option value="perkg"${s.convType==="perkg"?" selected":""}>₹/kg</option></select>`)}
   ${f("GST %",`<input class="in" style="width:70px" data-fkey="s-${s.id}-gst" value="${esc(num(s.gst)*100)}" oninput="setConv('${s.id}','gst',this.value)">`)}
  </div>
  <div style="font-size:12px;font-weight:700;color:var(--navy);margin:6px 0">Bill of materials (kg per ${s.unit})</div>
  ${lines}
  <div style="display:flex;justify-content:space-between;margin-top:8px"><button class="btn ghost" onclick="addLine('${s.id}')">+ material line</button><button class="linkbtn dark" style="color:var(--red)" onclick="delSku('${s.id}')">delete product</button></div></div>`;
}

function viewOffer(){
 const list=selList();
 if(!list.length)return `<div class="card" style="text-align:center;color:var(--mute)">No products selected yet. <button class="linkbtn dark" onclick="setTab('skus')">Pick products →</button></div>`;
 const L=S.L;
 let ctrls=`<div><div class="lbl">Loading method</div><select class="sel" onchange="setL('mode',this.value)"><option value="simplePct"${L.mode==="simplePct"?" selected":""}>Margin %</option><option value="simpleAmt"${L.mode==="simpleAmt"?" selected":""}>₹ per unit</option><option value="itemised"${L.mode==="itemised"?" selected":""}>Itemised</option></select></div>`;
 if(L.mode==="simplePct")ctrls+=`<div><div class="lbl">Margin %</div><input class="in" style="width:80px" data-fkey="L-pct" value="${esc(L.pct)}" oninput="setL('pct',this.value)"></div>`;
 if(L.mode==="simpleAmt")ctrls+=`<div><div class="lbl">₹ / unit</div><input class="in" style="width:90px" data-fkey="L-amt" value="${esc(L.amt)}" oninput="setL('amt',this.value)"></div>`;
 if(L.mode==="itemised")ctrls+=["overhead","margin","packing","freight"].map(k=>`<div><div class="lbl">${k[0].toUpperCase()+k.slice(1)}${(k==="overhead"||k==="margin")?" %":" ₹/unit"}</div><input class="in" style="width:74px" data-fkey="L-${k}" value="${esc(L[k])}" oninput="setL('${k}',this.value)"></div>`).join("");
 ctrls+=`<button class="linkbtn dark" onclick="clearOv()">clear overrides</button>`;
 let tex=0,tg=0,tgr=0;
 const rows=list.map(s=>{
  const o=S.over[s.id]||{};const rm=skuRM(s),mfg=skuMfg(s,o.mfg),ex=effOfferEx(s),gst=ex*num(s.gst);tex+=ex;tg+=gst;tgr+=ex+gst;
  let loadCell="";
  if(L.mode==="simplePct")loadCell=`<input class="in mini" data-fkey="ov-${s.id}-pct" value="${esc(o.pct!==undefined?o.pct:L.pct)}" oninput="setOv('${s.id}','pct',this.value)">%`;
  else if(L.mode==="simpleAmt")loadCell=`₹<input class="in mini" data-fkey="ov-${s.id}-amt" value="${esc(o.amt!==undefined?o.amt:L.amt)}" oninput="setOv('${s.id}','amt',this.value)">`;
  else loadCell=`<span style="color:var(--mute);font-size:11px">+${num(L.overhead)+num(L.margin)}% +₹${num(L.packing)+num(L.freight)}</span>`;
  const offVal=(o.offer!==undefined&&o.offer!=="")?o.offer:ex.toFixed(2);
  const mfgPh=s.convType==="pct"?"%":"₹/kg";
  return `<tr><td style="text-align:left;font-weight:600">${esc(s.category)} · ${esc(s.spec)}</td><td>${s.unit}</td><td style="color:var(--mute)">${inr(rm)}</td><td><input class="in mini" placeholder="${mfgPh}" data-fkey="ov-${s.id}-mfg" value="${esc(o.mfg!==undefined?o.mfg:"")}" oninput="setOv('${s.id}','mfg',this.value)"></td><td style="font-weight:600">${inr(mfg)}</td>
   <td>${loadCell}</td><td style="font-weight:700"><input class="in mini" style="width:88px;font-weight:700" data-fkey="ov-${s.id}-offer" value="${esc(offVal)}" oninput="setOv('${s.id}','offer',this.value)"></td>
   <td style="color:var(--mute)">${inr(gst)}</td><td style="font-weight:700;color:var(--navy)">${inr(ex+gst)}</td></tr>`;
 }).join("");
 return head("Offer & send","Enter MFG per product, then a loading, to reach the offer price. Override any cell directly for final control.")+
  `<div class="card" style="margin-bottom:14px"><div style="display:flex;gap:18px;flex-wrap:wrap;align-items:flex-end">${ctrls}</div></div>
   <div class="card" style="padding:0;overflow:hidden;margin-bottom:14px"><div style="overflow-x:auto"><table class="tbl">
    <thead><tr><th style="text-align:left">Product</th><th>Unit</th><th>RM ₹</th><th>MFG<br><span style="font-weight:400;font-size:10px">% or ₹/kg</span></th><th>Mfg cost</th><th>Loading</th><th>Offer ₹/unit<br><span style="font-weight:400;font-size:10px">ex-GST</span></th><th>GST</th><th>Gross ₹/unit</th></tr></thead>
    <tbody>${rows}</tbody>
    <tfoot><tr style="background:#FAFBFC;font-weight:700"><td colspan="6" style="text-align:right">Total</td><td>${inr(tex)}</td><td>${inr(tg)}</td><td style="color:var(--navy)">${inr(tgr)}</td></tr></tfoot></table></div></div>
   <div class="card" style="display:flex;gap:18px;align-items:flex-end;flex-wrap:wrap">
    <div><div class="lbl">Customer / Party</div><input class="in" style="width:240px" data-fkey="party" value="${esc(S.party)}" oninput="setParty(this.value)" placeholder="e.g. ABC Electricals, Kolkata"></div>
    <div><div class="lbl">Validity (days)</div><input class="in" style="width:80px" data-fkey="valid" value="${esc(S.validity)}" oninput="setValidity(this.value)"></div>
    <button class="btn" style="margin-left:auto;padding:10px 20px;font-size:14px" onclick="openQuote()">Generate quotation →</button></div>`;
}

function render(){
 const root=document.getElementById("root");
 const a=document.activeElement,key=a&&a.dataset?a.dataset.fkey:null,sel=a?a.selectionStart:null;
 let body="";
 if(S.tab==="prices")body=viewPrices();else if(S.tab==="skus")body=viewProducts();else body=viewOffer();
 root.innerHTML=viewHeader()+viewTabs()+`<div class="wrap">${body}</div>`;
 if(key){const el=root.querySelector('[data-fkey="'+key+'"]');if(el){el.focus();try{el.setSelectionRange(sel,sel);}catch(e){}}}
}

/* ---------- quotation ---------- */
function openQuote(){
 const list=selList();const date=today();
 const qno="CIL/Q/"+date.replace(/-/g,"")+"/"+(Math.floor(Math.random()*900)+100);
 const cu=matById("cu"),al=matById("al");
 const rows=list.map(s=>{const ex=effOfferEx(s),gst=ex*num(s.gst);return{name:s.category+" — "+s.name+" "+s.spec,unit:s.unit,ex,gstp:num(s.gst)*100,gross:ex+gst};});
 const tex=rows.reduce((a,r)=>a+r.ex,0),tgr=rows.reduce((a,r)=>a+r.gross,0);
 window._qcopy=function(){
  const h="Quotation "+qno+"\t"+date+"\nParty: "+(S.party||"—")+"\n\nProduct\tUnit\tRate (ex-GST)\tGST%\tRate (incl GST)";
  const b=rows.map(r=>r.name+"\t"+r.unit+"\t"+r.ex.toFixed(2)+"\t"+r.gstp+"\t"+r.gross.toFixed(2)).join("\n");
  const ft="\nTotal\t\t"+tex.toFixed(2)+"\t\t"+tgr.toFixed(2)+"\nPrices based on Copper as on "+(cu?cu.asOn:"")+", Aluminium as on "+(al?al.asOn:"")+". Valid "+S.validity+" days.";
  navigator.clipboard.writeText(h+"\n"+b+ft).then(()=>flashModal("Quotation copied"));
 };
 const units=[...new Set(rows.map(r=>r.unit))].join(" / ");
 document.getElementById("modal").innerHTML=`<div class="overlay">
  <div data-chrome style="position:fixed;top:14px;right:18px;display:flex;gap:8px;z-index:10">
   <button class="btn" onclick="window._qcopy()">Copy table</button>
   <button class="btn" onclick="window.print()">Print / Save PDF</button>
   <button class="btn ghost" onclick="closeQuote()">Close</button></div>
  <div class="sheet">
   <div style="display:flex;justify-content:space-between;align-items:flex-start;border-bottom:3px solid var(--navy);padding-bottom:14px">
    <img src="${LOGO}" style="height:46px">
    <div style="text-align:right;font-size:11.5px;color:var(--mute);line-height:1.6"><div style="font-size:18px;font-weight:700;color:var(--navy);letter-spacing:1px">QUOTATION</div><div>No. <b style="color:var(--ink)">${qno}</b></div><div>Date: ${date}</div></div></div>
   <div style="display:flex;justify-content:space-between;margin:16px 0;font-size:12.5px">
    <div><div style="color:var(--mute);font-size:11px">To</div><div style="font-weight:700;font-size:14px">${esc(S.party)||"____________________"}</div></div>
    <div style="text-align:right"><div style="color:var(--mute);font-size:11px">Validity</div><div style="font-weight:700">${esc(S.validity)} days from date</div></div></div>
   <table class="qtbl"><thead><tr><th style="text-align:left">#</th><th style="text-align:left">Product description</th><th>Unit</th><th>Rate (₹)<br><span style="font-weight:400">ex-GST</span></th><th>GST %</th><th>Rate (₹)<br><span style="font-weight:400">incl GST</span></th></tr></thead>
    <tbody>${rows.map((r,i)=>`<tr><td>${i+1}</td><td style="text-align:left">${esc(r.name)}</td><td>${r.unit}</td><td>${inr(r.ex)}</td><td>${r.gstp}</td><td style="font-weight:700">${inr(r.gross)}</td></tr>`).join("")}</tbody>
    <tfoot><tr><td colspan="3"></td><td style="font-weight:700">${inr(tex)}</td><td></td><td style="font-weight:700;color:var(--navy)">${inr(tgr)}</td></tr></tfoot></table>
   <div style="font-size:11px;color:var(--mute);margin-top:18px;line-height:1.7">
    <div>• Prices indicative, based on <b>Copper as on ${cu?cu.asOn:"—"}</b> and <b>Aluminium as on ${al?al.asOn:"—"}</b>; subject to revision with metal movement.</div>
    <div>• Rates are per ${units}. Taxes as applicable. Freight extra unless stated.</div>
    <div>• E&amp;OE. This is a system-generated quotation from Cabcon India Limited.</div></div>
   <div style="margin-top:40px;display:flex;justify-content:space-between;align-items:flex-end">
    <div style="font-size:11px;color:var(--mute)">Cabcon India Limited · Kolkata / Howrah, West Bengal</div>
    <div style="text-align:center;font-size:12px"><div style="border-top:1px solid var(--ink);padding-top:4px;width:180px">Authorised Signatory</div></div></div></div></div>`;
}
function closeQuote(){document.getElementById("modal").innerHTML="";}
function flashModal(m){const o=document.querySelector(".overlay [data-chrome]");if(o){const b=document.createElement("span");b.textContent=m;b.style.cssText="align-self:center;color:#fff;font-size:12px;background:#1B7A3D;padding:4px 10px;border-radius:5px";o.prepend(b);setTimeout(()=>b.remove(),1500);}}

load();render();
</script>
</body>
</html>
