<h2 mat-dialog-title>Price Trend - {{ material.name }} {{ material.vendorName ? '(' + material.vendorName + ')' : '' }}</h2>
<mat-dialog-content>
  <div class="chart-container" *ngIf="!loading()">
    <canvas baseChart
            [data]="lineChartData"
            [options]="lineChartOptions"
            [type]="'line'">
    </canvas>
  </div>
  <div *ngIf="loading()" style="padding: 24px; text-align: center; color: var(--text-secondary);">
    Loading trend data...
  </div>
</mat-dialog-content>
<mat-dialog-actions align="end">
  <button mat-button (click)="onCancel()">Close</button>
</mat-dialog-actions>
