<h2 mat-dialog-title class="dialog-title-row">
  <span>Price Trend — {{ data.name }}</span>
</h2>
<mat-dialog-content>
  <div class="chart-container" *ngIf="!loading() && hasData()">
    <canvas baseChart
            [data]="lineChartData"
            [options]="lineChartOptions"
            [type]="'line'">
    </canvas>
  </div>
  <div *ngIf="!loading() && !hasData()" class="empty-state">
    <mat-icon style="font-size: 36px; width: 36px; height: 36px; color: var(--text-secondary); margin-bottom: 8px;">show_chart</mat-icon>
    <p style="margin: 0; font-size: 13px;">No price trend history recorded yet for {{ data.name }}.</p>
  </div>
  <div *ngIf="loading()" class="loading-state">
    Loading price trend data…
  </div>
</mat-dialog-content>
<mat-dialog-actions align="end">
  <button mat-button (click)="onCancel()">Close</button>
</mat-dialog-actions>
