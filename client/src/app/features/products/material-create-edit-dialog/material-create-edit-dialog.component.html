<h2 mat-dialog-title>{{ material ? 'Edit Material Details' : 'Add Material' }}</h2>
<mat-dialog-content>
  <form [formGroup]="form" class="edit-form">
    <!-- Row 1: Material Name -->
    <mat-form-field appearance="outline" class="full-width-field">
      <mat-label>Material Name</mat-label>
      <input matInput formControlName="name" placeholder="e.g. Copper wire, XLPE, GI Steel Wire">
      <mat-error *ngIf="form.get('name')?.hasError('required')">Name is required</mat-error>
      <mat-error *ngIf="form.get('name')?.hasError('nameExists')">Material name already exists</mat-error>
    </mat-form-field>

    <!-- Row 2: Category Name & Density -->
    <div class="form-row-2col">
      <mat-form-field appearance="outline">
        <mat-label>Category Name</mat-label>
        <mat-select formControlName="categoryName" (selectionChange)="onCategoryChange($event.value)">
          <mat-option *ngFor="let cat of categories" [value]="cat">
            {{ cat }}
          </mat-option>
        </mat-select>
        <mat-error *ngIf="form.get('categoryName')?.hasError('required')">Category is required</mat-error>
      </mat-form-field>

      <mat-form-field appearance="outline">
        <mat-label>Density</mat-label>
        <input matInput formControlName="density" type="number" step="0.001" placeholder="e.g. 8.89">
        <span matTextSuffix style="font-size: 11px; color: var(--text-secondary); margin-right: 6px;">g/cm³</span>
        <mat-error *ngIf="form.get('density')?.hasError('required')">Density is required</mat-error>
        <mat-error *ngIf="form.get('density')?.hasError('min')">Must be ≥ 0</mat-error>
      </mat-form-field>
    </div>
  </form>
</mat-dialog-content>
<mat-dialog-actions align="end">
  <button mat-button (click)="onCancel()">Cancel</button>
  <button mat-flat-button class="btn-primary" [disabled]="form.invalid || loading()" (click)="onSubmit()">
    {{ material ? 'Save Changes' : 'Create Material' }}
  </button>
</mat-dialog-actions>
