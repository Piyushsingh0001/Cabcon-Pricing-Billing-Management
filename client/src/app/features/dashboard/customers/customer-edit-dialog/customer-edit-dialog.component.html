<h2 mat-dialog-title class="dialog-header-title">
  <div class="title-left">
    <mat-icon class="title-icon">person</mat-icon>
    <span>{{ data?.id ? 'Edit Customer' : 'New Customer' }}</span>
  </div>
</h2>

<mat-dialog-content>
  <form [formGroup]="form" (ngSubmit)="onSubmit()" id="customerForm">
    <div class="form-grid">
      
      <!-- Row 1: Customer Name (Full Width, same width as GST) -->
      <mat-form-field appearance="outline" class="full">
        <mat-label>Customer Name</mat-label>
        <mat-icon matPrefix>person</mat-icon>
        <input matInput formControlName="name" placeholder="Enter customer name">
        <mat-error *ngIf="form.get('name')?.hasError('required')">Customer name is required</mat-error>
      </mat-form-field>

      <!-- Row 2: Contact Number & GST Number side-by-side -->
      <div class="form-row-2col">
        <mat-form-field appearance="outline">
          <mat-label>Contact Number</mat-label>
          <mat-icon matPrefix>phone</mat-icon>
          <input matInput formControlName="contactNumber" placeholder="Enter contact number">
        </mat-form-field>

        <mat-form-field appearance="outline">
          <mat-label>GST Number</mat-label>
          <mat-icon matPrefix>receipt_long</mat-icon>
          <input matInput formControlName="gstNumber" placeholder="Enter GST number">
        </mat-form-field>
      </div>

      <div class="full addresses-container" formArrayName="addresses">
        <div class="addresses-header">
          <mat-label class="section-label">Addresses</mat-label>
        </div>

        <div *ngFor="let addrCtrl of addressesArray.controls; let i = index" class="address-card">
          <div class="address-card-header">
            <div class="address-card-title">
              <span class="addr-num">Address {{ i + 1 }}</span>
              
              <!-- Default Address Title Badge or Trigger -->
              <span class="default-badge" *ngIf="form.get('defaultIndex')?.value === i">
                <mat-icon class="star-icon">star</mat-icon> Default Address
              </span>
              <button type="button" class="btn-make-default" *ngIf="form.get('defaultIndex')?.value !== i" (click)="setDefaultAddress(i)">
                Set as Default
              </button>
            </div>

            <button mat-icon-button color="warn" type="button" (click)="removeAddress(i)" [disabled]="addressesArray.length === 1 && addrCtrl.value === ''" title="Remove Address">
              <mat-icon>delete</mat-icon>
            </button>
          </div>

          <mat-form-field appearance="outline" class="address-field">
            <mat-icon matPrefix>location_on</mat-icon>
            <textarea matInput rows="4" [formControlName]="i" placeholder="Enter complete address details..."></textarea>
          </mat-form-field>
        </div>

        <button mat-stroked-button color="primary" type="button" class="btn-add-address" (click)="addAddress()">
          <mat-icon>add</mat-icon> Add New Address
        </button>
      </div>

    </div>
  </form>
</mat-dialog-content>

<mat-dialog-actions align="end">
  <button mat-button type="button" (click)="onCancel()">Cancel</button>
  <button mat-flat-button color="primary" type="submit" form="customerForm" [disabled]="form.invalid || loading">
    <mat-spinner *ngIf="loading" diameter="18"></mat-spinner>
    <span>{{ data?.id ? 'Update Customer' : 'Save Customer' }}</span>
  </button>
</mat-dialog-actions>
