<div class="edit-dialog-container">

  <div class="dialog-header">
    <div class="header-icon">
      <mat-icon>person</mat-icon>
    </div>

    <div>
      <h2>{{ data?.id ? 'Edit Customer' : 'New Customer' }}</h2>
      <p>Enter customer details below.</p>
    </div>
  </div>

  <form [formGroup]="form" (ngSubmit)="onSubmit()">

    <div class="form-grid">

      <mat-form-field appearance="outline">
        <mat-label>Customer Name</mat-label>
        <mat-icon matPrefix>person</mat-icon>

        <input
          matInput
          formControlName="name">

        <mat-error
          *ngIf="form.get('name')?.hasError('required')">
          Customer name is required
        </mat-error>

      </mat-form-field>

      <mat-form-field appearance="outline">
        <mat-label>Contact Number</mat-label>
        <mat-icon matPrefix>phone</mat-icon>

        <input
          matInput
          formControlName="contactNumber">
      </mat-form-field>

      <mat-form-field
          appearance="outline"
          class="full">

        <mat-label>GST Number</mat-label>

        <mat-icon matPrefix>receipt_long</mat-icon>

        <input
          matInput
          formControlName="gstNumber">

      </mat-form-field>

      <div class="full addresses-container" formArrayName="addresses">
        <div class="addresses-header">
          <mat-label style="font-weight: 500; font-size: 14px; margin-bottom: 8px; display: block;">Addresses</mat-label>
        </div>
        <div *ngFor="let addrCtrl of addressesArray.controls; let i = index" class="address-item" style="display: flex; gap: 8px; align-items: start; margin-bottom: 8px;">
          <div style="display: flex; flex-direction: column; align-items: center; margin-top: 12px; gap: 4px;">
            <input type="radio" name="defaultIndexGroup" [checked]="form.get('defaultIndex')?.value === i" (change)="form.get('defaultIndex')?.setValue(i)" [value]="i" title="Set as default address" style="cursor: pointer;">
            <small style="font-size: 10px; color: #666;">Default</small>
          </div>
          <mat-form-field appearance="outline" style="flex: 1; margin-bottom: 0;">
            <mat-icon matPrefix>location_on</mat-icon>
            <textarea matInput rows="2" [formControlName]="i" placeholder="Enter address"></textarea>
          </mat-form-field>
          <button mat-icon-button color="warn" type="button" (click)="removeAddress(i)" [disabled]="addressesArray.length === 1 && addrCtrl.value === ''" style="margin-top: 4px;" title="Remove Address">
            <mat-icon>delete</mat-icon>
          </button>
        </div>
        <button mat-button color="primary" type="button" (click)="addAddress()">
          <mat-icon>add</mat-icon> Add New Address
        </button>
      </div>

    </div>

    <div class="dialog-actions">

      <button
        mat-stroked-button
        type="button"
        (click)="onCancel()">

        Cancel

      </button>

      <button
        mat-flat-button
        color="primary"
        type="submit"
        [disabled]="form.invalid || loading">

        <mat-spinner
            *ngIf="loading"
            diameter="18">
        </mat-spinner>

        <span *ngIf="!loading">
          {{ data?.id ? 'Update Customer' : 'Save Customer' }}
        </span>

        <span *ngIf="loading">
          {{ data?.id ? 'Updating...' : 'Saving...' }}
        </span>

      </button>

    </div>

  </form>

</div>
