<ng-container *ngIf="isAuthenticated(); else loginLayout">
  <div class="app-container">
    <mat-toolbar color="primary" class="main-toolbar">
      <button mat-icon-button (click)="sidenav.toggle()">
        <mat-icon>menu</mat-icon>
      </button>
      <img src="images/logo.jpg" alt="Cabcon Logo" class="toolbar-logo">
      <span class="spacer"></span>
      
      <!-- User profile info -->
      <div class="user-profile" *ngIf="currentUser() as user">
        <span class="user-name">{{ user.fullName }}</span>
        <span class="user-role">{{ user.roles.join(', ') }}</span>
        <button mat-icon-button [matMenuTriggerFor]="profileMenu">
          <mat-icon>account_circle</mat-icon>
        </button>
        <mat-menu #profileMenu="matMenu" xPosition="before">
          <button mat-menu-item (click)="logout()">
            <mat-icon>exit_to_app</mat-icon>
            <span>Sign Out</span>
          </button>
        </mat-menu>
      </div>
    </mat-toolbar>

    <mat-sidenav-container class="sidenav-container">
      <mat-sidenav #sidenav mode="side" opened class="main-sidenav">
        <mat-nav-list>
          <a mat-list-item routerLink="/dashboard" routerLinkActive="active-link" *ngIf="hasPermission('Quotation.Generate')">
            <mat-icon matListItemIcon>dashboard</mat-icon>
            <span matListItemTitle>Calculator Dashboard</span>
          </a>
          <a mat-list-item routerLink="/quotations" routerLinkActive="active-link" *ngIf="hasPermission('Quotation.View')">
            <mat-icon matListItemIcon>receipt</mat-icon>
            <span matListItemTitle>Quotation History</span>
          </a>
          <a mat-list-item routerLink="/materials" routerLinkActive="active-link" *ngIf="hasPermission('Pricing.View')">
            <mat-icon matListItemIcon>category</mat-icon>
            <span matListItemTitle>Material Prices</span>
          </a>
          <a mat-list-item routerLink="/skus" routerLinkActive="active-link" *ngIf="hasPermission('Sku.View')">
            <mat-icon matListItemIcon>inventory_2</mat-icon>
            <span matListItemTitle>SKUs & BOMs</span>
          </a>
          <a mat-list-item routerLink="/admin" routerLinkActive="active-link" *ngIf="hasPermission('Users.View')">
            <mat-icon matListItemIcon>admin_panel_settings</mat-icon>
            <span matListItemTitle>Admin Panel</span>
          </a>
        </mat-nav-list>
      </mat-sidenav>

      <mat-sidenav-content class="main-content">
        <div class="page-container">
          <router-outlet></router-outlet>
        </div>
      </mat-sidenav-content>
    </mat-sidenav-container>
  </div>
</ng-container>

<ng-template #loginLayout>
  <router-outlet></router-outlet>
</ng-template>
