<div class="confirm-dialog-wrapper" [ngClass]="data.type">
  <div class="dialog-header">
    <mat-icon class="status-icon" *ngIf="data.type === 'error'">error</mat-icon>
    <mat-icon class="status-icon" *ngIf="data.type === 'confirm' || data.type === 'warning'">warning</mat-icon>
    <mat-icon class="status-icon" *ngIf="data.type === 'info'">info</mat-icon>
    <h2 class="dialog-title">{{ data.title }}</h2>
  </div>

  <div class="dialog-body">
    <p class="dialog-message">{{ data.message }}</p>
  </div>

  <div class="dialog-actions">
    <!-- For confirm mode: cancel & confirm buttons -->
    <ng-container *ngIf="data.type === 'confirm'">
      <button class="btn-cancel" type="button" (click)="onCancel()">
        {{ data.cancelText || 'Cancel' }}
      </button>
      <button class="btn-confirm" type="button" (click)="onConfirm()">
        {{ data.confirmText || 'Confirm' }}
      </button>
    </ng-container>

    <!-- For info/error/warning alerts: just a close/ok button -->
    <ng-container *ngIf="data.type !== 'confirm'">
      <button class="btn-confirm" type="button" (click)="onConfirm()">
        {{ data.confirmText || 'OK' }}
      </button>
    </ng-container>
  </div>
</div>
