name: Cabcon CI/CD

on:
  push:
    branches:
      - main

jobs:
  build-backend:
    runs-on: self-hosted

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup .NET 9
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 9.0.x

      - name: Restore NuGet Packages
        run: dotnet restore

      - name: Build Solution
        run: dotnet build --configuration Release --no-restore

      - name: Publish Web API
        run: dotnet publish .\src\Cabcon.WebApi\Cabcon.SKUQuoteApi.csproj -c Release -o C:\Deployments\API
